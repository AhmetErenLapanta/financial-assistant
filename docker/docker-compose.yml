services:
  postgres:
    container_name: ai-service-postgres
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_DB: aiservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
      PGPASSWORD: postgres
    volumes:
      - ai-service:/data/postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: "pg_isready -U postgres -d aiservice"
      interval: 2s
      timeout: 20s
      retries: 10

volumes:
  ai-service:
    driver: local
